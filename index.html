<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      margin: 0; padding: 12px; background: #0f172a; color: #fff;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh; box-sizing: border-box;
    }
    #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6; }
    #status { margin-top: 12px; font-size: 14px; color: #38bdf8; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Arahkan Kamera ke QR Code</div>

  <script>
    // SALIN URL WEB APP APPS SCRIPT ANDA DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz9N6LBG_0SyKYZi4Ug7txLokMRUgNejKoZ0yU-h0JFvxaeaoP_I7_a_zlv4H7dxXw5/exec";

    let isScanning = true;

    // Fungsi suara Beep tajam saat scan berhasil
    function playBeepSound(success) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        if (success) {
          osc.frequency.setValueAtTime(1800, audioCtx.currentTime); // Beep tinggi & nyaring
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        } else {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime); // Beep nada rendah (gagal)
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function startScanner() {
      const html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(() => {
        html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess);
      });
    }

    function onScanSuccess(nisnCode) {
      if (!isScanning) return;
      isScanning = false;

      document.getElementById('status').innerText = 'Mencari Data NISN: ' + nisnCode + '...';

      // Mengirimkan data ke Apps Script menggunakan Metode POST (Tanpa mengganggu doGet/Login)
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "scanQRStandalone",
          payload: {
            nisn: nisnCode,
            kelas: "9B",
            mapel: "Presensi QR"
          }
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          playBeepSound(true); // Suara Beep Sukses
          document.getElementById('status').innerText = '✅ ' + data.nama + ' (' + data.waktu + ')';
          alert("✅ PRESENSI BERHASIL!\n\nNama : " + data.nama + "\nNISN : " + data.nisn + "\nWaktu: " + data.waktu);
        } else {
          playBeepSound(false);
          document.getElementById('status').innerText = '❌ ' + data.message;
          alert("❌ GAGAL PRESENSI:\n" + data.message);
        }

        setTimeout(() => {
          isScanning = true;
          document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code';
        }, 3000);
      })
      .catch(err => {
        playBeepSound(false);
        document.getElementById('status').innerText = '❌ Gagal koneksi ke server';
        alert("Error: Gagal terhubung ke Apps Script.");
        setTimeout(() => { isScanning = true; }, 3000);
      });
    }

    window.addEventListener('DOMContentLoaded', startScanner);
  </script>
</body>
</html>
