<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #1f2937;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #status {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #38bdf8;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 12px;
      border-radius: 12px;
      white-space: nowrap;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Mengaktifkan Kamera...</div>

  <script>
    let html5QrcodeScanner = null;

    function startCameraDirectly() {
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      const config = { 
        fps: 15, 
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0
      };

      // Coba akses kamera belakang langsung
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(function(err) {
        // Fallback ke kamera default/depan jika kamera belakang gagal
        html5QrcodeScanner.start(
          { facingMode: "user" },
          config,
          onScanSuccess
        ).catch(function(err2) {
          const statusEl = document.getElementById('status');
          statusEl.innerText = 'Izin kamera diblokir browser.';
          statusEl.style.color = '#f87171';
        });
      });
    }

    function onScanSuccess(decodedText) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = 'QR Terbaca: ' + decodedText;
      statusEl.style.color = '#4ade80';

      // Kirim hasil pemindaian langsung ke parent Google Apps Script
      window.parent.postMessage({
        type: 'QR_SCAN_RESULT',
        code: decodedText
      }, '*');
    }

    // Jalankan eksekusi kamera otomatis saat halaman dimuat
    window.addEventListener('DOMContentLoaded', startCameraDirectly);
  </script>
</body>
</html>
