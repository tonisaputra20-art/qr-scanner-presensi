<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: #0f172a; color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    #reader {
      width: 100%; max-width: 380px; min-height: 280px;
      border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6;
      background: #1e293b;
    }
    #status {
      margin-top: 16px; font-size: 15px; color: #38bdf8; text-align: center;
      font-weight: 600; min-height: 24px;
    }
    button.retry-btn {
      margin-top: 10px; padding: 8px 16px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Menginisialisasi Kamera...</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz9N6LBG_0SyKYZi4Ug7txLokMRUgNejKoZ0yU-h0JFvxaeaoP_I7_a_zlv4H7dxXw5/exec";

    let html5QrCode = null;
    let isScanning = true;

    // Audio Beep Tajam Singkat untuk Scan Berhasil
    function playBeepSound(success) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        if (success) {
          osc.frequency.setValueAtTime(1800, audioCtx.currentTime); // 1800Hz Beep Nyaring
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        } else {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime); // Low frequency tone untuk error
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function initScanner() {
      document.getElementById('status').innerText = 'Membuka Kamera...';
      
      if (html5QrCode) {
        html5QrCode.stop().then(() => startCamera()).catch(() => startCamera());
      } else {
        startCamera();
      }
    }

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 220, height: 220 } 
      };

      // Coba akses kamera belakang (environment) terlebih dahulu
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .then(() => {
          document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code';
        })
        .catch(() => {
          // Jika kamera belakang tidak tersedia, gunakan kamera mana saja yang ada
          html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
            .then(() => {
              document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code';
            })
            .catch(err => {
              document.getElementById('status').innerHTML = '❌ Gagal Mengakses Kamera.<br><button class="retry-btn" onclick="initScanner()">Coba Lagi</button>';
            });
        });
    }

    function onScanSuccess(nisnCode) {
      if (!isScanning) return;
      isScanning = false;

      document.getElementById('status').innerText = 'Mencari Data NISN: ' + nisnCode + '...';

      // Mengirim data menggunakan URLSearchParams (Universal & Tanpa Masalah CORS)
      const formData = new URLSearchParams();
      formData.append("action", "scanQRStandalone");
      formData.append("nisn", nisnCode);
      formData.append("kelas", "9B");
      formData.append("mapel", "Presensi QR");

      fetch(WEB_APP_URL, {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          playBeepSound(true);
          document.getElementById('status').innerText = '✅ ' + data.nama + ' (' + data.waktu + ')';
          alert("✅ PRESENSI BERHASIL!\n\nNama : " + data.nama + "\nNISN : " + data.nisn + "\nWaktu: " + data.waktu);
        } else {
          playBeepSound(false);
          document.getElementById('status').innerText = '❌ ' + data.message;
          alert("❌ GAGAL PRESENSI:\n" + data.message);
        }

        setTimeout(() => {
          isScanning = true;
          document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code';
        }, 3000);
      })
      .catch(err => {
        playBeepSound(false);
        document.getElementById('status').innerText = '❌ Gagal koneksi ke server';
        alert("Error: Gagal terhubung ke Apps Script.");
        setTimeout(() => { isScanning = true; }, 3000);
      });
    }

    window.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
