<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #reader { width: 100%; max-width: 360px; border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6; background: #1e293b; }
    #status { margin-top: 16px; font-size: 15px; color: #38bdf8; text-align: center; font-weight: 600; min-height: 24px; padding: 0 10px; }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Membuka Kamera...</div>

  <script>
    // URL Web App Google Apps Script Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzcQYjVnuY5K10Q_s04R3V3O1GiaqYmSdBD7Rx7aR5_ngf42ok9BuzfRDAWsL3Yzvt2/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const selectedKelas = urlParams.get('kelas') || '';
    const selectedMapel = urlParams.get('mapel') || '';

    let isScanning = true;
    let html5Qrcode = null;

    function playBeepSound(success) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = success ? 880 : 300;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + (success ? 0.2 : 0.4));
      } catch (e) {}
    }

    function sendToGAS(nisn) {
  const statusEl = document.getElementById('status');
  statusEl.innerText = `Memproses NISN: ${nisn}...`;

  const cbName = 'cb_' + Math.floor(Math.random() * 1000000);

  window[cbName] = function(res) {
    cleanup();
    if (res && (res.status === 'success' || res.success)) {
      playBeepSound(true);
      statusEl.innerText = `✅ Berhasil: ${res.nama || nisn} (${res.status_kehadiran || 'HADIR'})`;
    } else {
      playBeepSound(false);
      statusEl.innerText = `❌ ${res.message || 'Gagal Merekam Presensi'}`;
    }
    setTimeout(() => { isScanning = true; }, 2500);
  };

  // TAMBAHKAN action=scanQRStandalone DI URL
  const script = document.createElement('script');
  script.id = cbName;
  script.src = `${WEB_APP_URL}?action=scanQRStandalone&nisn=${encodeURIComponent(nisn)}&kelas=${encodeURIComponent(selectedKelas)}&mapel=${encodeURIComponent(selectedMapel)}&callback=${cbName}`;

  function cleanup() {
    delete window[cbName];
    const el = document.getElementById(cbName);
    if (el) el.remove();
  }

  script.onerror = function() {
    cleanup();
    playBeepSound(false);
    statusEl.innerText = '❌ Gagal Terhubung ke Server';
    setTimeout(() => { isScanning = true; }, 2500);
  };

  document.body.appendChild(script);
}

      script.onerror = function() {
        cleanup();
        playBeepSound(false);
        statusEl.innerText = '❌ Gagal Terhubung ke Server';
        setTimeout(() => { isScanning = true; }, 2500);
      };

      document.body.appendChild(script);
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      sendToGAS(decodedText.trim());
    }

    window.addEventListener('DOMContentLoaded', () => {
      html5Qrcode = new Html5Qrcode("reader");
      html5Qrcode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).then(() => {
        document.getElementById('status').innerText = 'Siap melakukan scan...';
      }).catch(err => {
        document.getElementById('status').innerText = '❌ Izin kamera ditolak atau tidak ditemukan.';
      });
    });
  </script>
</body>
</html>
