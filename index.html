<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      margin: 0; padding: 12px; background: #0f172a; color: #fff;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh; box-sizing: border-box;
    }
    #reader { width: 100%; max-width: 420px; border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6; }
    #status { margin-top: 10px; font-size: 14px; color: #38bdf8; text-align: center; font-weight: 500; }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Mengaktifkan Kamera...</div>

  <script>
    let isScanning = true;

    function startScanner() {
      const html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(() => {
        html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess);
      });
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false; // Kunci agar tidak berulang membaca saat memproses

      document.getElementById('status').innerText = 'QR Terbaca: ' + decodedText + '. Memproses...';

      // Kirim hasil NISN ke Apps Script utama
      if (window.opener) {
        window.opener.postMessage({
          type: 'QR_SCAN_RESULT',
          code: decodedText
        }, '*');
      }

      // Aktifkan pemindaian kembali setelah 3 detik
      setTimeout(() => {
        isScanning = true;
        document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code';
      }, 3000);
    }

    window.addEventListener('DOMContentLoaded', startScanner);
  </script>
</body>
</html>
