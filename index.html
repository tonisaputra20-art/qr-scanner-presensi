<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px; background: #0f172a; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    }
    #reader { width: 100%; max-width: 360px; border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6; background: #1e293b; }
    #status { margin-top: 14px; font-size: 14px; color: #38bdf8; text-align: center; font-weight: 600; min-height: 24px; }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Membuka Kamera...</div>

  <script>
    // URL Web App Terbaru Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzcQYjVnuY5K10Q_s04R3V3O1GiaqYmSdBD7Rx7aR5_ngf42ok9BuzfRDAWsL3Yzvt2/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const selectedKelas = urlParams.get('kelas') || '';
    const selectedMapel = urlParams.get('mapel') || '';

    let isScanning = true;
    let html5QrCode = null;

    function playBeepSound(success) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        if (success) {
          osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        } else {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .then(() => { document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code'; })
        .catch(() => {
          html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
            .then(() => { document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code'; })
            .catch(err => { document.getElementById('status').innerText = '❌ Gagal Mengakses Kamera'; });
        });
    }

    function onScanSuccess(nisnCode) {
      if (!isScanning) return;
      isScanning = false;

      document.getElementById('status').innerText = 'Memverifikasi QR: ' + nisnCode + '...';

      // Global Callback untuk JSONP
      window.handleQRResponse = function(response) {
        if (response.status === 'success') {
          playBeepSound(true);
          document.getElementById('status').innerText = '✅ ' + response.nama + ' (' + response.status_kehadiran + ')';
          alert("✅ PRESENSI BERHASIL!\n\nNama : " + response.nama + "\nNISN : " + response.nisn + "\nStatus: " + response.status_kehadiran + "\nWaktu : " + response.waktu);
        } else {
          playBeepSound(false);
          document.getElementById('status').innerText = '❌ ' + response.message;
          alert("❌ VALIDASI GAGAL:\n" + response.message);
        }

        const oldScript = document.getElementById('jsonp-qr-script');
        if (oldScript) oldScript.remove();

        setTimeout(() => {
          isScanning = true;
          document.getElementById('status').innerText = 'Arahkan Kamera ke QR Code';
        }, 3000);
      };

      // Trik JSONP Tembus Koneksi 100%
      const script = document.createElement('script');
      script.id = 'jsonp-qr-script';
      script.src = WEB_APP_URL + '?action=scanQRStandalone&nisn=' + encodeURIComponent(nisnCode) + 
                 '&kelas=' + encodeURIComponent(selectedKelas) + 
                 '&mapel=' + encodeURIComponent(selectedMapel) + 
                 '&callback=handleQRResponse';

      script.onerror = function() {
        playBeepSound(false);
        document.getElementById('status').innerText = '❌ Gagal koneksi ke Apps Script';
        alert("Error: Gagal terhubung ke Apps Script.");
        setTimeout(() => { isScanning = true; }, 3000);
      };

      document.body.appendChild(script);
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
