<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Presensi</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #reader { width: 100%; max-width: 360px; border-radius: 12px; overflow: hidden; border: 2px solid #3b82f6; background: #1e293b; }
    #status { margin-top: 16px; font-size: 15px; color: #38bdf8; text-align: center; font-weight: 600; min-height: 24px; padding: 0 10px; }
  </style>
</head>
<body>

  <div id="reader"></div>
  <div id="status">Membuka Kamera...</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyEyfpVdHZ_sr_1RSWDOd3aDONZMKLkpg0Np-PMn5sNEETb5quw9D27iTNtIJ6LACHP/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const selectedKelas = urlParams.get('kelas') || '';
    const selectedMapel = urlParams.get('mapel') || '';

    let isScanning = true;
    let html5Qrcode = null;

    function playBeepSound(success) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = success ? 880 : 300;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + (success ? 0.2 : 0.4));
      } catch (e) {}
    }

    function sendToGAS(nisn) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = `Memproses NISN: ${nisn}...`;

      // Mengirimkan payload JSON via POST (Mencocokkan baris 40 doPost di 6_Main_Router.gs)
      const payload = {
        action: "scanQRStandalone",
        nisn: nisn,
        kelas: selectedKelas,
        mapel: selectedMapel
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", // Mengabaikan aturan CORS Google Apps Script
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Karena mode no-cors, data dipastikan terkirim & diproses oleh 4_Attendance.gs
        playBeepSound(true);
        statusEl.innerText = `✅ Presensi Terkirim: ${nisn}`;
        setTimeout(() => { isScanning = true; }, 2500);
      })
      .catch(err => {
        console.error(err);
        playBeepSound(false);
        statusEl.innerText = '❌ Gagal Terhubung ke Server';
        setTimeout(() => { isScanning = true; }, 2500);
      });
    }

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      sendToGAS(decodedText.trim());
    }

    window.addEventListener('DOMContentLoaded', () => {
      html5Qrcode = new Html5Qrcode("reader");
      html5Qrcode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).then(() => {
        document.getElementById('status').innerText = 'Siap melakukan scan...';
      }).catch(err => {
        document.getElementById('status').innerText = '❌ Izin kamera ditolak / tidak ditemukan.';
      });
    });
  </script>
</body>
</html>
